<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Lit Studio — Offline</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        overflow: hidden;
      }

      /* Ambient blobs */
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        opacity: 0.25;
      }
      .blob-1 {
        width: 50vw; height: 50vw;
        top: -10%; left: -10%;
        background: radial-gradient(circle, #8B5CF6 0%, transparent 70%);
        animation: drift 12s ease-in-out infinite;
      }
      .blob-2 {
        width: 40vw; height: 40vw;
        bottom: -5%; right: -5%;
        background: radial-gradient(circle, #D946EF 0%, transparent 70%);
        animation: drift 16s ease-in-out infinite reverse;
      }

      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        33% { transform: translate(20px, -15px); }
        66% { transform: translate(-12px, 10px); }
      }

      /* Note icon */
      .icon-wrap {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(139, 92, 246, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
        animation: pulse-icon 3s ease-in-out infinite;
      }

      @keyframes pulse-icon {
        0%, 100% { box-shadow: 0 0 0 0 rgba(139,92,246,0); }
        50% { box-shadow: 0 0 0 12px rgba(139,92,246,0.08); }
      }

      .icon-wrap svg { width: 48px; height: 48px; }

      .content { text-align: center; max-width: 320px; position: relative; z-index: 1; }

      h1 {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(135deg, #8B5CF6, #D946EF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
      }

      p {
        font-size: 15px;
        color: rgba(255,255,255,0.55);
        line-height: 1.6;
        margin-bottom: 8px;
      }

      .divider {
        width: 60px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(139,92,246,0.5), rgba(217,70,239,0.5), transparent);
        margin: 24px auto;
      }

      .action-btn {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 28px;
        border-radius: 100px;
        background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(217,70,239,0.15));
        border: 1px solid rgba(139,92,246,0.35);
        color: rgba(255,255,255,0.85);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s;
        letter-spacing: 0.3px;
      }
      .action-btn:hover {
        background: linear-gradient(135deg, rgba(139,92,246,0.35), rgba(217,70,239,0.25));
        border-color: rgba(139,92,246,0.6);
      }

      .brand {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: rgba(139,92,246,0.6);
        font-weight: 700;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="content">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 14 L17 30 Q17 33 14 33 Q11 33 11 30 Q11 27 14 27 Q15.5 27 17 28 L17 20 L31 17 L31 27 Q31 30 28 30 Q25 30 25 27 Q25 24 28 24 Q29.5 24 31 25 L31 18 Z" fill="url(#og)" stroke="none"/>
          <defs>
            <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8B5CF6"/>
              <stop offset="100%" stop-color="#D946EF"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <div class="brand">Lit Studio</div>

      <h1>You're offline</h1>
      <p>Your collection is still available. Check your connection and try again.</p>

      <div class="divider"></div>

      <p style="font-size:13px; color: rgba(255,255,255,0.35)">
        Cached pages and audio tracks remain available while offline.
      </p>

      <button class="action-btn" onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </body>
</html>
