[package]
name = "lit-curve"
version = "0.1.0"
description = "Lit Studio custom bonding curve — pump.fun-compatible constant product AMM"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lit_curve"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
